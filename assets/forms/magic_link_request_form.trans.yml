      label: อีเมลหรือชื่อผู้ใช้
  action:
    submit: ส่งลิงก์ให้ฉัน
  success:
    message: 'หากบัญชีนี้มีอยู่ ลิงก์เข้าสู่ระบบได้ถูกส่งไปยังที่อยู่อีเมลของบัญชีแล้ว'

tr:
