      label: '이메일 또는 사용자 이름'
  action:
    submit: '링크 보내기'
  success:
    message: '이 계정이 존재한다면, 로그인 링크가 해당 이메일 주소로 전송되었습니다.'

nl:
  description: 'Ontvang een link per e-mail waarmee je je zonder wachtwoord kunt aanmelden.'
  field:
    identifier:
      label: 'E-mail of gebruikersnaam'
  action:
    submit: 'Stuur me een link'
  success:
    message: 'Als dit account bestaat, is er een aanmeldlink naar het e-mailadres verzonden.'

pl:
  description: 'Otrzymaj link na email, który zaloguje Cię bez hasła.'
  field:
    identifier:
      label: 'Email lub nazwa użytkownika'
  action:
    submit: 'Wyślij mi link'
  success:
    message: 'Jeśli to konto istnieje, link do logowania został wysłany na jego adres email.'

pt_BR:
