en:
  description: Receive a link by email that signs you in without a password.

  field:
    identifier:
      label: Email or username

  action:
    submit: Send me a link

  success:
    message: If this account exists, a sign-in link has been sent to its email address.

ar:
  description: 'استلم رابطًا عبر البريد الإلكتروني يتيح لك تسجيل الدخول بدون كلمة مرور.'
  field:
    identifier:
      label: 'البريد الإلكتروني أو اسم المستخدم'
  action:
    submit: 'أرسل لي رابطًا'
  success:
    message: 'إذا كان هذا الحساب موجودًا، فقد تم إرسال رابط تسجيل الدخول إلى عنوان بريده الإلكتروني.'

bn:
  description: 'একটি লিঙ্ক ইমেইলে গ্রহণ করুন যা আপনাকে পাসওয়ার্ড ছাড়াই সাইন ইন করতে দেয়।'
  field:
    identifier:
      label: 'ইমেইল বা ব্যবহারকারীর নাম'
  action:
    submit: 'আমাকে একটি লিঙ্ক পাঠান'
  success:
    message: 'যদি এই অ্যাকাউন্টটি বিদ্যমান থাকে, তবে একটি সাইন-ইন লিঙ্ক এর ইমেইল ঠিকানায় পাঠানো হয়েছে।'

de:
  description: 'Erhalten Sie einen Link per E-Mail, der Sie ohne Passwort anmeldet.'
  field:
    identifier:
      label: 'E-Mail oder Benutzername'
  action:
    submit: 'Senden Sie mir einen Link'
  success:
    message: 'Wenn dieses Konto existiert, wurde ein Anmeldelink an die E-Mail-Adresse gesendet.'

es:
  description: 'Recibe un enlace por correo electrónico que te inicia sesión sin necesidad de contraseña.'
  field:
    identifier:
      label: 'Correo electrónico o nombre de usuario'
  action:
    submit: 'Envíame un enlace'
  success:
    message: 'Si esta cuenta existe, se ha enviado un enlace de inicio de sesión a su dirección de correo electrónico.'

fa:
  description: 'یک لینک از طریق ایمیل دریافت کنید که بدون نیاز به رمز عبور شما را وارد می‌کند.'
  field:
    identifier:
      label: 'ایمیل یا نام کاربری'
  action:
    submit: 'برای من لینک ارسال کن'
  success:
    message: 'اگر این حساب وجود داشته باشد، یک لینک ورود به ایمیل آن ارسال شده است.'

fi:
  description: 'Saat sähköpostitse linkin, joka kirjautuu sisään ilman salasanaa.'
  field:
    identifier:
      label: 'Sähköposti tai käyttäjätunnus'
  action:
    submit: 'Lähetä minulle linkki'
  success:
    message: 'Jos tämä tili on olemassa, kirjautumislinkki on lähetetty sen sähköpostiosoitteeseen.'

fr:
  description: Recevez par email un lien qui vous connecte sans mot de passe.

  field:
    identifier:
      label: Email ou nom d'utilisateur

  action:
    submit: M'envoyer un lien

  success:
    message: Si ce compte existe, un lien de connexion a été envoyé à son adresse email.

he:
  description: 'קבל קישור בדוא"ל שמכניס אותך ללא סיסמה.'
  field:
    identifier:
      label: 'דוא"ל או שם משתמש'
  action:
    submit: 'שלח לי קישור'
  success:
    message: 'אם החשבון הזה קיים, קישור כניסה נשלח לכתובת הדוא"ל שלו.'

hi:
  description: 'ईमेल द्वारा एक लिंक प्राप्त करें जो आपको पासवर्ड के बिना साइन इन करता है।'
  field:
    identifier:
      label: 'ईमेल या उपयोगकर्ता नाम'
  action:
    submit: 'मुझे एक लिंक भेजें'
  success:
    message: 'यदि यह खाता अस्तित्व में है, तो साइन-इन लिंक इसके ईमेल पते पर भेजा गया है।'

id:
  description: 'Terima tautan melalui email yang memungkinkan Anda masuk tanpa kata sandi.'
  field:
    identifier:
      label: 'Email atau nama pengguna'
  action:
    submit: 'Kirimkan saya tautan'
  success:
    message: 'Jika akun ini ada, tautan masuk telah dikirim ke alamat emailnya.'

it:
  description: 'Ricevi un link via email che ti permette di accedere senza password.'
  field:
    identifier:
      label: 'Email o nome utente'
  action:
    submit: 'Inviami un link'
  success:
    message: "Se questo account esiste, un link per l'accesso è stato inviato al suo indirizzo email."

ja:
  description: パスワードなしでサインインできるリンクをメールで受け取ります。
  field:
    identifier:
      label: メールアドレスまたはユーザー名
  action:
    submit: リンクを送信
  success:
    message: このアカウントが存在する場合、サインインリンクがそのメールアドレスに送信されました。

ko:
  description: '비밀번호 없이 로그인할 수 있는 링크를 이메일로 받으세요.'
  field:
