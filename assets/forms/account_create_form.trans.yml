en:
  field:
    email:
      label: Email

  action:
    submit: Open the account

  error:
    email_taken: An account already holds this address.
    refused:
      role_not_assignable: This role is not yours to give.
      email_domain_not_allowed: This role asks for an address of another domain.
      exclusive_roles: These two roles are never held together.
      target_out_of_scope: This account is not yours to administer.
      self_deactivation: An account cannot deactivate itself.
      self_demotion: An account cannot take its own role away.
      last_protected_role_holder: This role would be left without an active holder.
      account_inactive: This account cannot sign in, so it is sent no mail.

  success:
    message: Account opened. Its holder has been sent the mail to choose a password.

fr:
  field:
    email:
      label: Email

  action:
    submit: Créer le compte

  error:
    email_taken: Un compte utilise déjà cette adresse.
    refused:
      role_not_assignable: Ce rôle n'est pas le vôtre à donner.
      email_domain_not_allowed: Ce rôle demande une adresse d'un autre domaine.
      exclusive_roles: Ces deux rôles ne vont jamais ensemble.
      target_out_of_scope: Ce compte n'est pas le vôtre à administrer.
      self_deactivation: Un compte ne peut pas se désactiver lui-même.
      self_demotion: Un compte ne peut pas retirer son propre rôle.
      last_protected_role_holder: Ce rôle resterait sans titulaire actif.
      account_inactive: Ce compte ne peut pas se connecter, aucun mail ne lui est envoyé.

  success:
    message: Compte créé. Son titulaire a reçu le mail pour choisir un mot de passe.

zh:
  field:
    email:
      label: 电子邮件
  action:
    submit: 开通账户
  error:
    email_taken: 该地址已被其他账户占用。
    refused:
      role_not_assignable: 您无法授予此角色。
      email_domain_not_allowed: 此角色需要另一个域的地址。
      exclusive_roles: 这两个角色不能同时拥有。
      target_out_of_scope: 该账户不属于您管理。
      self_deactivation: 账户无法自我停用。
      self_demotion: 账户无法撤销自己的角色。
      last_protected_role_holder: 此角色将没有有效持有者。
      account_inactive: 该账户无法登录，因此不会收到邮件。
  success:
    message: 账户已开通。持有人已收到选择密码的邮件。

ar:
  field:
    email:
      label: 'البريد الإلكتروني'
  action:
    submit: 'فتح الحساب'
  error:
    email_taken: 'هناك حساب بالفعل يحمل هذا العنوان.'
    refused:
      role_not_assignable: 'هذا الدور ليس لك لتمنحه.'
      email_domain_not_allowed: 'هذا الدور يتطلب عنوانًا من نطاق آخر.'
      exclusive_roles: 'لا يمكن أن يتم احتفاظ هذين الدورين معًا.'
      target_out_of_scope: 'هذا الحساب ليس لك لإدارته.'
      self_deactivation: 'لا يمكن لحساب أن يُ deaktiv نفسه.'
      self_demotion: 'لا يمكن لحساب أن يسحب دوره الخاص.'
      last_protected_role_holder: 'سيبقى هذا الدور بدون حامل نشط.'
      account_inactive: 'لا يمكن لهذا الحساب تسجيل الدخول، لذا لن يتم إرسال أي بريد.'
  success:
    message: 'تم فتح الحساب. تم إرسال بريد إلى حامله لاختيار كلمة مرور.'
