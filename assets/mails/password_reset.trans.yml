en:
  subject: Reset your password
  intro: "Follow this link to choose a new password:"
  validity: It works once, until %date%. If you did not ask for it, ignore this email, your password stays as it is.

ar:
  subject: 'إعادة تعيين كلمة المرور الخاصة بك'
  intro: 'اتبع هذا الرابط لاختيار كلمة مرور جديدة:'
  validity: 'يعمل مرة واحدة، حتى %date%. إذا لم تكن قد طلبت ذلك، تجاهل هذا البريد الإلكتروني، ستبقى كلمة مرورك كما هي.'

bn:
  subject: 'আপনার পাসওয়ার্ড রিসেট করুন'
  intro: 'একটি নতুন পাসওয়ার্ড বাছাই করতে এই লিঙ্কটি অনুসরণ করুন:'
  validity: 'এটি একবার কাজ করবে, %date% পর্যন্ত। যদি আপনি এটি না চান, তবে এই ইমেইলটি উপেক্ষা করুন, আপনার পাসওয়ার্ড অপরিবর্তিত থাকবে।'

de:
  subject: 'Setzen Sie Ihr Passwort zurück'
  intro: 'Folgen Sie diesem Link, um ein neues Passwort auszuwählen:'
  validity: 'Es funktioniert einmal, bis %date%. Wenn Sie das nicht angefordert haben, ignorieren Sie diese E-Mail, Ihr Passwort bleibt unverändert.'

es:
  subject: 'Restablecer tu contraseña'
  intro: 'Sigue este enlace para elegir una nueva contraseña:'
  validity: 'Funciona una vez, hasta %date%. Si no lo solicitaste, ignora este correo, tu contraseña permanece igual.'

fa:
  subject: 'رمز عبور خود را بازنشانی کنید'
  intro: 'این لینک را دنبال کنید تا یک رمز عبور جدید انتخاب کنید:'
  validity: 'این یک بار کار می‌کند، تا %date%. اگر این درخواست را نکرده‌اید، این ایمیل را نادیده بگیرید، رمز عبور شما همان‌طور که هست باقی می‌ماند.'

fi:
  subject: 'Nollaa salasanasi'
  intro: 'Seuraa tätä linkkiä valitaksesi uuden salasanan:'
  validity: 'Se toimii kerran, kunnes %date%. Jos et ole pyytänyt tätä, voit jättää tämän sähköpostin huomiotta, salasanasi pysyy ennallaan.'

fr:
  subject: Réinitialisez votre mot de passe
  intro: "Suivez ce lien pour choisir un nouveau mot de passe :"
  validity: Il fonctionne une seule fois, jusqu'au %date%. Si vous ne l'avez pas demandé, ignorez cet email, votre mot de passe reste inchangé.

he:
  subject: 'אפס את הסיסמה שלך'
  intro: 'עקוב אחרי הקישור הזה כדי לבחור סיסמה חדשה:'
  validity: 'זה עובד פעם אחת, עד %date%. אם לא ביקשת את זה, פשוט התעלם מהמייל הזה, הסיסמה שלך נשארת כפי שהיא.'

hi:
  subject: 'अपने पासवर्ड को रीसेट करें'
  intro: 'नया पासवर्ड चुनने के लिए इस लिंक का पालन करें:'
  validity: 'यह एक बार काम करता है, जब तक %date%। यदि आपने इसके लिए अनुरोध नहीं किया है, तो इस ईमेल की अनदेखी करें, आपका पासवर्ड वैसा ही रहेगा।'

id:
  subject: 'Atur ulang kata sandi Anda'
  intro: 'Ikuti tautan ini untuk memilih kata sandi baru:'
  validity: 'Ini berfungsi sekali, hingga %date%. Jika Anda tidak memintanya, abaikan email ini, kata sandi Anda tetap sama.'

it:
  subject: 'Reimposta la tua password'
  intro: 'Segui questo link per scegliere una nuova password:'
  validity: "Funziona una sola volta, fino a %date%. Se non l'hai richiesta, ignora questa email, la tua password rimane invariata."

ja:
  subject: パスワードをリセットする
  intro: 新しいパスワードを選ぶには、こちらのリンクをクリックしてください：
  validity: 一度だけ有効です。%date%まで。これを要求していない場合は、このメールを無視してください。あなたのパスワードはそのままです。

ko:
  subject: '비밀번호 재설정'
  intro: '새 비밀번호를 선택하려면 이 링크를 따라가세요:'
  validity: '한 번만 작동하며, %date%까지 유효합니다. 요청하지 않으셨다면 이 이메일을 무시하세요, 귀하의 비밀번호는 그대로 유지됩니다.'

nl:
  subject: 'Stel je wachtwoord opnieuw in'
  intro: 'Volg deze link om een nieuw wachtwoord te kiezen:'
  validity: 'Het werkt één keer, tot %date%. Als je dit niet hebt aangevraagd, negeer dan deze e-mail, je wachtwoord blijft hetzelfde.'

pl:
  subject: 'Zresetuj swoje hasło'
  intro: 'Kliknij w ten link, aby wybrać nowe hasło:'
  validity: 'Działa jednorazowo, do %date%. Jeśli nie prosiłeś o to, zignoruj ten e-mail, twoje hasło pozostaje bez zmian.'

pt_BR:
  subject: 'Redefina sua senha'
  intro: 'Siga este link para escolher uma nova senha:'
  validity: 'Ele funciona uma vez, até %date%. Se você não solicitou, ignore este email, sua senha permanece a mesma.'

ru:
  subject: 'Сбросьте ваш пароль'
  intro: 'Перейдите по этой ссылке, чтобы выбрать новый пароль:'
  validity: 'Он работает один раз, до %date%. Если вы не запрашивали это, проигнорируйте это письмо, ваш пароль останется прежним.'

th:
  subject: รีเซ็ตรหัสผ่านของคุณ
  intro: 'ให้ติดตามลิงก์นี้เพื่อเลือกสร้างรหัสผ่านใหม่:'
  validity: 'ใช้งานได้ครั้งเดียว จนถึง %date% หากคุณไม่ได้ขอให้ทำ ให้ละเลยอีเมลนี้ รหัสผ่านของคุณจะยังคงเป็นเหมือนเดิม.'

tr:
  subject: 'Şifrenizi sıfırlayın'
  intro: 'Yeni bir şifre seçmek için bu bağlantıyı izleyin:'
  validity: 'Bu bir kez çalışır, %date% tarihine kadar. Eğer bunu siz istemediyseniz, bu e-postayı dikkate almayın, şifreniz olduğu gibi kalacaktır.'

ur:
  subject: 'اپنا پاس ورڈ دوبارہ سیٹ کریں'
  intro: 'نیا پاس ورڈ منتخب کرنے کے لئے اس لنک پر جائیں:'
  validity: 'یہ ایک بار کام کرتا ہے، جب تک کہ %date%۔ اگر آپ نے اس کی درخواست نہیں کی ہے تو اس ای میل کو نظر انداز کریں، آپ کا پاس ورڈ ویسا ہی رہے گا۔'

vi:
  subject: 'Đặt lại mật khẩu của bạn'
  intro: 'Theo liên kết này để chọn mật khẩu mới:'
  validity: 'Nó chỉ hoạt động một lần, cho đến %date%. Nếu bạn không yêu cầu điều này, hãy bỏ qua email này, mật khẩu của bạn vẫn giữ nguyên.'

zh:
  subject: 重置您的密码
  intro: 请点击此链接选择新密码：
  validity: 该链接有效一次，直到%date%。如果您没有请求此操作，请忽略此邮件，您的密码将保持不变。
