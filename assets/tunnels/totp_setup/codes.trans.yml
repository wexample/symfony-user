en:
  intro: "The app is on. Keep these backup codes somewhere safe: each one signs you in once, without the app. They are shown only now."
  shown: The backup codes were shown once and are not kept in clear. New ones are made from the authenticator page.
  done: Done

fr:
  intro: "L'application est activée. Gardez ces codes de secours en lieu sûr : chacun permet une connexion sans l'application. Ils ne sont affichés que maintenant."
  shown: Les codes de secours ont été affichés une fois et ne sont pas conservés en clair. De nouveaux codes se créent depuis la page de l'authentificateur.
  done: Terminé
