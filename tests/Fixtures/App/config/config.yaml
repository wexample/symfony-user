framework:
  test: true
  secret: "test"
  session:
    storage_factory_id: session.storage.factory.mock_file

doctrine:
  orm:
    enable_native_lazy_objects: true
    mappings:
      FixtureApp:
        type: attribute
        dir: '%kernel.project_dir%/Entity'
        prefix: 'Wexample\SymfonyUser\Tests\Fixtures\App\Entity'
        is_bundle: false

security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: plaintext
  providers:
    users:
      entity:
        class: Wexample\SymfonyUser\Tests\Fixtures\App\Entity\User
  firewalls:
    main:
      lazy: true
      provider: users

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonyUser\Tests\Fixtures\App\Repository\:
    resource: '../Repository/'
