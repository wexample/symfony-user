framework:
  test: true
  # 256 bits at least: the trusted device cookie is a JWT signed with it.
  secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  # The stateless CSRF protection of the Symfony Flex recipe.
  form:
    csrf_protection:
      token_id: submit
  csrf_protection:
    stateless_token_ids: [submit, authenticate, logout]
  session:
    storage_factory_id: session.storage.factory.mock_file
  mailer:
    dsn: 'null://null'
    headers:
      From: 'no-reply@example.com'

doctrine:
  orm:
    enable_native_lazy_objects: true
    mappings:
      FixtureApp:
        type: attribute
        dir: '%kernel.project_dir%/Entity'
        prefix: 'Wexample\SymfonyUser\Tests\Fixtures\App\Entity'
        is_bundle: false

security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: plaintext
  providers:
    users:
      entity:
        class: Wexample\SymfonyUser\Tests\Fixtures\App\Entity\User
  firewalls:
    main:
      lazy: true
      provider: users
      custom_authenticators:
        - Wexample\SymfonyUser\Security\Authenticator\LoginFormAuthenticator
      entry_point: Wexample\SymfonyUser\Security\Authenticator\LoginFormAuthenticator
      user_checker: Wexample\SymfonyUser\Security\UserChecker
      logout:
        path: user_security_logout
      login_throttling:
        max_attempts: 3
      login_link:
        check_route: user_security_login_link
        signature_properties: [password, dateLastLogin]
        lifetime: 600
      two_factor:
        auth_form_path: user_security_two_factor
        # The code leaves with the password check, the form may be a modal.
        prepare_on_login: true
        check_path: /_forms/submit/form-two_factor_code_form
        auth_code_parameter_name: two_factor_code_form[code]
        trusted_parameter_name: two_factor_code_form[trusted]
        success_handler: Wexample\SymfonyUser\Security\Handler\TwoFactorResponseHandler
        failure_handler: Wexample\SymfonyUser\Security\Handler\TwoFactorResponseHandler
        authentication_required_handler: Wexample\SymfonyUser\Security\Handler\TwoFactorResponseHandler
        enable_csrf: true
        csrf_parameter: two_factor_code_form[_token]
        csrf_token_id: submit
  access_control:
    - { path: ^/login/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
    - { path: ^/protected, roles: ROLE_USER }

scheb_two_factor:
  security_tokens:
    - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
  trusted_device:
    enabled: true
    lifetime: 5184000
  totp:
    enabled: true
    issuer: Fixture
    leeway: 1
  backup_codes:
    enabled: true

wexample_symfony_loader:
  front_paths:
    front: '%kernel.project_dir%/../front/'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonyUser\Tests\Fixtures\App\Repository\:
    resource: '../Repository/'

  Wexample\SymfonyUser\Tests\Fixtures\App\Controller\:
    resource: '../Controller/'
    tags: ['controller.service_arguments']

  # symfony-testing registers it with the string '@kernel' instead of a
  # reference, which only YAML turns into the kernel service.
  Wexample\SymfonyHelpers\Service\BundleService:
    arguments: ['@kernel']
