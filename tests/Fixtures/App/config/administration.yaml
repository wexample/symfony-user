# symfony-testing's TestKernel sets this parameter itself, over
# `security.role_hierarchy`: it is set again here.
parameters:
  security.role_hierarchy.roles:
    ROLE_OWNER: [ROLE_MANAGER]
    ROLE_MANAGER: [ROLE_SUPPORT, ROLE_CUSTOMER]

wexample_symfony_user:
  administration:
    # The screens are there, for the managers alone.
    page_role: ROLE_MANAGER
    protected_roles: [ROLE_MANAGER]
    role_email_domains:
      ROLE_MANAGER: [example.com]
    exclusive_roles:
      ROLE_MANAGER: [ROLE_CUSTOMER]

services:
  # No controller of the fixture application uses it: kept for the tests.
  test.account_administration:
    alias: Wexample\SymfonyUser\Service\AccountAdministrationService
    public: true
  test.csrf_token_manager:
    alias: security.csrf.token_manager
    public: true
