wexample_symfony_user:
  password:
    refuse_leaked: true

services:
  # The real validator, over a client that answers as api.pwnedpasswords.com
  # does — the hash suffixes sharing the first five characters of the one
  # asked for, with how many times each leaked. The body is the range of
  # `Tr0mb0ne-Caravan-82`, and nothing else is in it.
  validator.not_compromised_password:
    class: Symfony\Component\Validator\Constraints\NotCompromisedPasswordValidator
    arguments:
      - '@test.pwned_passwords.client'
      - 'UTF-8'
      - true
    tags: ['validator.constraint_validator']

  test.pwned_passwords.client:
    class: Symfony\Component\HttpClient\MockHttpClient
    arguments:
      - !service
        class: Symfony\Component\HttpClient\Response\MockResponse
        arguments:
          - "9FF657E1CF61A9EA8C7D71B096558CD5509:42\r\n0D7CF9A4E99856F6E1B9F3FC2B9E0F1D6A2:3"
